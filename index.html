<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maddox Prata | Personal Website</title>

</head>

<body>

<h1 class="title">Maddox Prata</h1>
<p class="subtitle">Personal Website</p>

<!-- TREE AREA -->
<div id="tree-container">

  <div class="ornament star" onclick="openPopup('about')">⭐</div>

  <!-- ORNAMENTS -->

  <div class="ornament white" onclick="openPopup('education')"></div>

<!-- LEGEND -->
<div id="legend">
  <h3>Ornament Legend</h3>
  <ul>
    <li><span class="legend-icon star"></span> About Me</li>

    <li><span class="legend-icon bell"></span> Contact</li>
  </ul>
</div>

<div id="popup">
  <div id="popup-content">
    <button onclick="closePopup()">✖</button>
    <div id="popup-text"></div>
  </div>
</div>
