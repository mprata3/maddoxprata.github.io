<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maddox Prata - Personal Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- WELCOME PAGE -->
  <div id="welcome-page">
    <h1>Welcome to My Personal Website</h1>
    <p>This website highlights my interests, goals, and experiences in a creative and professional format.</p>
    <button onclick="showTree()">Enter My Christmas Tree</button>
  </div>

  <!-- CHRISTMAS TREE PAGE -->
  <div id="tree-page" style="display:none;">
    <h1>My Christmas Tree</h1>
    <p>Click an ornament to learn more!</p>

    <div class="ornaments">
      <button class="ornament star" onclick="openPopup('about')">⭐ About Me</button>
      <button class="ornament white" onclick="openPopup('education')">🎓 Education</button>
      <button class="ornament red" onclick="openPopup('skills')">🛠 Skills</button>
    </div>
  </div>

  <!-- POPUP -->
  <div id="popup">
    <div id="popup-content">
      <span id="close-btn" onclick="closePopup()">×</span>
      <div id="popup-text"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
